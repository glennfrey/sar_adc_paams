// xcelium_ams.cfg — Xcelium AMS configuration for SPICE-AMS co-simulation
// Maps Verilog instances to SPICE netlists
//
// Usage: xrun -ams -cfg xcelium_ams.cfg ...

// Use SPICE view for analog blocks, Verilog for digital
viewlist spice verilog ams;
stoplist spice;

// Map analog instances to SPICE subcircuits
instance {*.u_sah} {spice} lib=sar_ams_spice cell=sampl_hold_spice view=spice;
instance {*.u_comp} {spice} lib=sar_ams_spice cell=comparator_spice view=spice;
instance {*.u_dac} {spice} lib=sar_ams_spice cell=dac_spice view=spice;

// Connect modules: translate between digital (verilog) and analog (spice) ports
// connect rules digital_analog;
